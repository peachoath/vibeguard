spring:
  application:
    name: vibeguard-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vibeguard}
    username: ${DB_USER:vibeguard}
    password: ${DB_PASSWORD:vibeguard}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:changeme}
            client-secret: ${GITHUB_CLIENT_SECRET:changeme}
            scope: read:user,repo

# Agent Runner callback (HMAC-signed) — see PRD NFR-S4
vibeguard:
  runner:
    base-url: ${RUNNER_BASE_URL:http://localhost:4000}
    callback-secret: ${RUNNER_CALLBACK_SECRET:dev-secret-change-me}

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
