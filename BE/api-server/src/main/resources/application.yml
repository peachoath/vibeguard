spring:
  application:
    name: vibeguard-api

  # DB: Supabase 관리형 PostgreSQL 16 (PRD §12).
  # 운영/공유 개발은 Supavisor 세션 풀러(포트 5432) + sslmode=require 로 접속.
  #   DB_URL  예) jdbc:postgresql://aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
  #   DB_USER 예) postgres.<project-ref>
  # 아래 기본값은 로컬 docker-compose 폴백용입니다(오프라인 개발 시에만).
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vibeguard}
    username: ${DB_USER:vibeguard}
    password: ${DB_PASSWORD:vibeguard}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:changeme}
            client-secret: ${GITHUB_CLIENT_SECRET:changeme}
            # 로그인에 필요한 최소 스코프. 리포 스캔(F-02)이 붙을 때 repo 추가 예정.
            scope: read:user,user:email

vibeguard:
  # GitHub access token 암호화 키 (AES-256-GCM, NFR-S3). base64 인코딩된 32바이트.
  # 운영에서는 반드시 TOKEN_ENC_KEY 환경변수로 교체하세요.
  security:
    token-key: ${TOKEN_ENC_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
  # Agent Runner callback (HMAC-signed) — see PRD NFR-S4
  runner:
    base-url: ${RUNNER_BASE_URL:http://localhost:4000}
    callback-secret: ${RUNNER_CALLBACK_SECRET:dev-secret-change-me}

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
