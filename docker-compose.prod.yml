# VibeGuard 프로덕션 오버레이 (AWS EC2 배포)
#
# 기본 docker-compose.yml 위에 얹어 HTTPS 리버스 프록시(Caddy)를 추가하고,
# api-server의 호스트 포트 직접 노출을 닫는다(외부 진입은 Caddy 443만).
#
# 사용:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#   (scripts/deploy.sh 에 PROD=1 을 주면 자동으로 이 오버레이를 함께 적용)
#
# 사전조건:
#   - .env 에 DEPLOY_DOMAIN(예: api.example.com), SPRING_PROFILES_ACTIVE=prod 지정
#   - DNS A 레코드가 EC2 퍼블릭 IP(Elastic IP)를 가리킴
#   - EC2 보안그룹 인바운드 80/443 TCP 개방

services:
  caddy:
    image: caddy:2
    container_name: vibeguard-caddy
    depends_on:
      api-server:
        condition: service_healthy
    environment:
      # Caddyfile 이 참조하는 도메인. 미설정 시 기동 실패하므로 .env에 반드시 지정.
      DEPLOY_DOMAIN: "${DEPLOY_DOMAIN:?set DEPLOY_DOMAIN in .env e.g. api.example.com}"
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # 발급된 인증서 영속 (재기동 시 재발급 방지)
      - caddy_config:/config
    restart: unless-stopped

  # 프로덕션에선 api-server 호스트 포트를 외부에 직접 열지 않는다.
  # 외부 진입은 Caddy(443)만. (내부 네트워크로 caddy→api-server:8080 접근)
  # !reset 으로 기본 compose의 ports 목록을 병합이 아니라 완전히 비운다(Compose 2.24+).
  api-server:
    ports: !reset []

volumes:
  caddy_data:
  caddy_config:
