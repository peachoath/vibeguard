# VibeGuard — 로컬 개발용 인프라 (PRD §12: 데모는 단일 VM + Docker Compose)
#
# ⚠️ DB는 기본적으로 Supabase 관리형 PostgreSQL 16을 사용합니다(.env의 DB_* 참고).
#    아래 postgres 서비스는 "오프라인 로컬 개발 폴백"용입니다 — 쓰려면 .env의
#    로컬 DB_URL 주석을 활성화하세요. 공유 개발/운영은 Supabase로 붙습니다.
#
# api-server / agent-runner 서비스는 각 Dockerfile 작성 후(W1 후반) 주석 해제해 통합합니다.

services:
  postgres:
    image: postgres:16
    container_name: vibeguard-postgres
    environment:
      POSTGRES_DB: vibeguard
      POSTGRES_USER: vibeguard
      POSTGRES_PASSWORD: vibeguard
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vibeguard']
      interval: 5s
      timeout: 3s
      retries: 10

  # api-server:
  #   build: ./BE/api-server
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   environment:
  #     DB_URL: jdbc:postgresql://postgres:5432/vibeguard
  #   ports: ['8080:8080']

  # agent-runner:
  #   build: ./BE/agent
  #   environment:
  #     ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
  #   ports: ['4000:4000']

volumes:
  pgdata:
