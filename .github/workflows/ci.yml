name: CI

# dev/main 대상 PR과 push에서 백엔드 빌드·테스트를 자동 검증한다.
# (FE는 다른 담당 영역이라 이 워크플로에 포함하지 않는다.)
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

# 같은 브랜치에서 연속 push 시 이전 실행 취소
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-server:
    name: api-server (Spring Boot / Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BE/api-server
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle (캐시 포함)
        uses: gradle/actions/setup-gradle@v4

      - name: Build & Test
        # ubuntu-latest 러너는 Docker가 기본 제공되어 Testcontainers 테스트가 동작한다.
        run: ./gradlew build --no-daemon

      - name: 테스트 리포트 업로드 (실패 시 디버깅용)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-server-test-report
          path: BE/api-server/build/reports/tests/
          if-no-files-found: ignore

  agent:
    name: agent (Node 22 / TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BE/agent
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: BE/agent/package-lock.json

      - name: Install
        run: npm ci

      - name: Build (tsc, 전체 workspace)
        run: npm run build
